<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PJ per Mercat Destí — ACR Estruch</title>
<style>
/* ── CONTROL BAR (screen only) ── */
.ctrl{background:#fff;color:#1D2433;padding:10px 18px;display:flex;align-items:center;gap:12px;font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;flex-wrap:wrap;border-bottom:1px solid #E7E9ED}
.ctrl-title{font-weight:700;color:#00387C;font-size:13.5px}
.ctrl label{color:#6B7280}
.ctrl select{padding:5px 9px;border-radius:8px;border:1px solid #E7E9ED;background:#fff;color:#1D2433;font-size:12.5px;cursor:pointer}
.ctrl button{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12.5px;font-family:inherit}
.btn-print{background:#00387C;color:#fff;font-weight:600}
.btn-print:hover{background:#1a54a0}
.btn-close{background:#fff;color:#1D2433;border:1px solid #E7E9ED}
.btn-close:hover{background:#F9FAFB}
.ctrl-status{color:#6B7280;font-size:11.5px;margin-left:4px}
@media print{.ctrl{display:none}}

/* ── PRINT PAGE ── */
@page{size:A4 landscape;margin:12mm 14mm 16mm 14mm}
body{margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;background:#e9ecef;color:#1a1a1a}
.page{background:#fff;max-width:269mm;margin:14px auto;padding:12mm 14mm 14mm;box-sizing:border-box;min-height:182mm;box-shadow:0 2px 12px rgba(0,0,0,.15)}
@media print{body{background:#fff}.page{margin:0;padding:0;max-width:none;min-height:0;box-shadow:none}}

/* ── LOGO ── */
.logo-area{text-align:center;margin-bottom:7mm}
.logo-area img{height:30px;display:block;margin:0 auto}

/* ── TITLE ── */
.doc-title{font-size:9pt;font-weight:700;color:#1a3a6b;text-decoration:underline;margin-bottom:4mm;display:block;letter-spacing:.2px}

/* ── TABLE ── */
.fra-table{width:100%;border-collapse:collapse;font-size:7.5pt;font-family:'Segoe UI',Arial,sans-serif;color:#595959;table-layout:fixed}
.fra-table th{font-weight:600;color:#595959;border:none;border-bottom:.8px solid #888;padding:1.2mm 3px 1.4mm;text-align:left;font-size:7.5pt;white-space:nowrap}
.fra-table td{padding:.15mm 3px;vertical-align:top;border:none;line-height:1.25;font-size:7.5pt;color:#595959}

/* Column widths (7 cols) */
.fra-table th:nth-child(1),.fra-table td:nth-child(1){width:8%}
.fra-table th:nth-child(2),.fra-table td:nth-child(2){width:34%}
.fra-table th:nth-child(3),.fra-table td:nth-child(3){width:28%;text-transform:uppercase}
.fra-table th:nth-child(4),.fra-table td:nth-child(4){width:6%}
.fra-table th:nth-child(5),.fra-table td:nth-child(5){width:6%}
.fra-table th:nth-child(6),.fra-table td:nth-child(6){width:12%}
.fra-table th:nth-child(7),.fra-table td:nth-child(7){width:6%;text-align:center}
.fra-table th:nth-child(7){text-align:left}

.fra-table tfoot td{font-weight:700;border-top:.8px solid #888;padding-top:1.8mm;color:#595959;font-size:7.5pt}

/* Estat icon (mateix patró que factures cobrades/pendents) */
.estat-ico{display:inline-flex;align-items:center;justify-content:center;width:11px;height:11px;border-radius:50%;font-size:7.5px;font-weight:900;line-height:1;color:#fff;vertical-align:middle}
.estat-ico.actiu,.estat-ico.completat{background:rgba(35,110,250,.5)}
.estat-ico.pausat{background:#fd7e14}
.estat-ico.cancelat{background:rgba(220,53,69,.5)}

/* ── FOOTER ── */
.doc-footer{position:fixed;bottom:10mm;left:14mm;right:14mm;display:flex;align-items:baseline;justify-content:space-between;font-size:7pt;color:#aaa;font-family:'Segoe UI',Arial,sans-serif}
.doc-footer-addr{text-align:center;flex:1}
.doc-footer-info{white-space:nowrap;font-size:6.5pt}
@media screen{
  .doc-footer{position:static;margin-top:auto;padding-top:8mm;display:flex}
  .page{display:flex;flex-direction:column}
}
</style>
</head>
<body>

<!-- Control bar (screen only, not printed) -->
<div class="ctrl">
  <span class="ctrl-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round" style="vertical-align:-2px;margin-right:6px"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>PJ per Mercat Destí</span>
  <label>País Destí:</label>
  <select id="ctrl-pais" onchange="applyFilter()"><option value="">— Tots —</option></select>
  <button class="btn-print" onclick="window.print()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="M7 9V3h10v6"/><rect x="4" y="9" width="16" height="8" rx="1"/><path d="M7 14h10v7H7z"/></svg>Imprimir</button>
  <button class="btn-close" onclick="window.close()">✕ Tancar</button>
  <span class="ctrl-status" id="ctrl-status"></span>
</div>

<div class="page">

  <!-- Logo -->
  <div class="logo-area">
    <img src="logo.png" alt="ACR Estruch">
  </div>

  <!-- Title -->
  <span class="doc-title" id="doc-title-txt">PROJECTES PER MERCAT DESTÍ</span>

  <!-- Table -->
  <table class="fra-table">
    <thead>
      <tr>
        <th>IdPJ</th>
        <th>Descripció</th>
        <th>Client</th>
        <th>Origen</th>
        <th>Destí</th>
        <th>Entrada</th>
        <th>Estat</th>
      </tr>
    </thead>
    <tbody id="pj-tbody">
      <tr><td colspan="7" style="padding:6mm;color:#888;text-align:center">Carregant…</td></tr>
    </tbody>
    <tfoot id="pj-tfoot"></tfoot>
  </table>

  <!-- Footer fixat al peu -->
  <div class="doc-footer">
    <div class="doc-footer-info" id="page-info"></div>
    <div class="doc-footer-addr">Muntaner, 440, 1-1B &nbsp;|&nbsp; 08006 Barcelona &nbsp;|&nbsp; +34 609852478 &nbsp;|&nbsp; info@acrestruch.com &nbsp;|&nbsp; www.acrestruch.com</div>
  </div>

</div>

<script src="js/neon-client.js"></script>
<script>
requireAuth();

function fDate(s){
  if(!s) return '—';
  const [y,m,d]=s.split('T')[0].split('-');
  return `${d}.${m}.${String(y).slice(2)}`;
}

function fmtIdPJ(id){ return id ? String(id).padStart(8,'0') : '—'; }

function estatIco(estat){
  if(estat==='ACTIU')        return '<span class="estat-ico actiu">✓</span>';
  if(estat==='COMPLETAT')    return '<span class="estat-ico completat">✓</span>';
  if(estat==='PAUSAT')       return '<span class="estat-ico pausat">~</span>';
  if(estat==='CANCEL·LAT')   return '<span class="estat-ico cancelat">✗</span>';
  return estat||'—';
}

let allRows=[];

async function loadData(){
  const tbody=document.getElementById('pj-tbody');
  try{
    allRows=await sbGet('projectes','select=IdPJ,Descripcio,client,mercat_origen,mercat_desti,data_entrada,estat');
    // Mateix criteri que altres llistats: ordenem amb el codi ja "empadded"
    // a 8 dígits, ja que alguns IdPJ antics estan desats sense el zero inicial.
    allRows.sort((a,b)=>fmtIdPJ(a.IdPJ).localeCompare(fmtIdPJ(b.IdPJ)));

    const paisos=[...new Set(allRows.map(p=>p.mercat_desti).filter(Boolean))].sort();
    const sel=document.getElementById('ctrl-pais');
    paisos.forEach(p=>{
      const o=document.createElement('option');
      o.value=p; o.textContent=p;
      sel.appendChild(o);
    });

    applyFilter();
  }catch(e){
    tbody.innerHTML=`<tr><td colspan="7" style="color:#c00;padding:6mm">Error: ${e.message}</td></tr>`;
    document.getElementById('ctrl-status').textContent='Error de càrrega';
  }
}

function applyFilter(){
  const paisSel=document.getElementById('ctrl-pais').value;
  const rows=paisSel ? allRows.filter(p=>p.mercat_desti===paisSel) : allRows;
  const tbody=document.getElementById('pj-tbody');
  const tfoot=document.getElementById('pj-tfoot');

  document.getElementById('doc-title-txt').textContent = paisSel
    ? `PROJECTES PER MERCAT DESTÍ — ${paisSel}`
    : 'PROJECTES PER MERCAT DESTÍ';

  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="7" style="padding:6mm;color:#888;text-align:center">Cap projecte trobat</td></tr>';
    tfoot.innerHTML='';
    document.getElementById('ctrl-status').textContent='Cap projecte';
    return;
  }

  tbody.innerHTML=rows.map(p=>`<tr>
    <td>${fmtIdPJ(p.IdPJ)}</td>
    <td title="${p.Descripcio||''}">${p.Descripcio||'—'}</td>
    <td title="${p.client||''}">${p.client||'—'}</td>
    <td>${p.mercat_origen||'—'}</td>
    <td>${p.mercat_desti||'—'}</td>
    <td>${fDate(p.data_entrada)}</td>
    <td>${estatIco(p.estat)}</td>
  </tr>`).join('');
  tfoot.innerHTML=`<tr><td colspan="7" style="font-style:italic">Total projectes: ${rows.length}</td></tr>`;
  document.getElementById('ctrl-status').textContent=`${rows.length} projectes`;
  document.getElementById('page-info').textContent=`${new Date().toLocaleDateString('ca-ES')} - 1 / 1 - pj_mercat_desti`;
}

loadData();
</script>
</body>
</html>
