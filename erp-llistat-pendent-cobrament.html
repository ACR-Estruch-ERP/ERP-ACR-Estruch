<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pendent Cobrament — ACR Estruch</title>
<style>
/* ── CONTROL BAR (screen only) ── */
.ctrl{background:#1d2535;color:#fff;padding:9px 18px;display:flex;align-items:center;gap:12px;font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;flex-wrap:wrap}
.ctrl-title{font-weight:700;color:#7eb3ff;font-size:13.5px}
.ctrl label{color:#9aaccc}
.ctrl select,.ctrl input[type=date]{padding:4px 8px;border-radius:5px;border:1px solid #3a4a6a;background:#2a3550;color:#fff;font-size:12.5px;cursor:pointer}
.ctrl button{padding:6px 14px;border-radius:5px;border:none;cursor:pointer;font-size:12.5px;font-family:inherit}
.btn-print{background:#0d6efd;color:#fff;font-weight:600}
.btn-print:hover{background:#0b5ed7}
.btn-close{background:#3a4060;color:#ccc}
.btn-close:hover{background:#4a5070;color:#fff}
.ctrl-status{color:#6a8aaa;font-size:11.5px;margin-left:4px}
@media print{.ctrl{display:none}}

/* ── PRINT PAGE ── */
@page{size:A4 landscape;margin:12mm 14mm 16mm 14mm}
body{margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;background:#e9ecef;color:#1a1a1a}
.page{background:#fff;max-width:269mm;margin:14px auto;padding:12mm 14mm 14mm;box-sizing:border-box;min-height:182mm;box-shadow:0 2px 12px rgba(0,0,0,.15)}
@media print{body{background:#fff}.page{margin:0;padding:0;max-width:none;min-height:0;box-shadow:none}}

/* ── LOGO ── */
.logo-area{text-align:center;margin-bottom:7mm}
.logo-area img{height:30px;display:block;margin:0 auto}

/* ── TITLE ── */
.doc-title{font-size:9pt;font-weight:700;color:#1a3a6b;text-decoration:underline;margin-bottom:4mm;display:block;letter-spacing:.2px}

/* ── TABLE ── */
.fra-table{width:100%;border-collapse:collapse;font-size:7.5pt;font-family:'Segoe UI',Arial,sans-serif;color:#595959;table-layout:fixed}
.fra-table th{font-weight:600;color:#595959;border:none;border-bottom:.8px solid #888;padding:1.2mm 3px 1.4mm;text-align:left;font-size:7.5pt;white-space:nowrap}
.fra-table th.r,.fra-table td.r{text-align:right}
.fra-table td{padding:.15mm 3px;vertical-align:top;border:none;line-height:1.25;font-size:7.5pt;color:#595959}

/* Column widths (9 cols) */
.fra-table th:nth-child(1),.fra-table td:nth-child(1){width:8%}
.fra-table th:nth-child(2),.fra-table td:nth-child(2){width:22%;text-transform:uppercase}
.fra-table th:nth-child(3),.fra-table td:nth-child(3){width:9%}
.fra-table th:nth-child(4),.fra-table td:nth-child(4){width:9%}
.fra-table th:nth-child(5),.fra-table td:nth-child(5){width:9%}
.fra-table th:nth-child(6),.fra-table td:nth-child(6){width:10%}
.fra-table th:nth-child(7),.fra-table td:nth-child(7){width:11%}
.fra-table th:nth-child(8),.fra-table td:nth-child(8){width:11%}
.fra-table th:nth-child(9),.fra-table td:nth-child(9){width:11%}

.fra-table td.neg{color:#b00}

/* Subtotal per client */
.fra-table tr.subtotal td{background:none;font-weight:700;border:none;color:#595959;padding-top:.8mm;padding-bottom:.8mm;font-size:7.5pt}
.fra-table tr.subtotal td.lbl{font-size:7pt;color:#aaa;font-weight:400;font-style:normal}
.fra-table tr.grp-first td{padding-top:3.5mm}
.fra-table tfoot td{font-weight:700;border-top:.8px solid #888;padding-top:1.8mm;color:#595959;font-size:7.5pt}

/* ── FOOTER ── */
.doc-footer{position:fixed;bottom:10mm;left:14mm;right:14mm;display:flex;align-items:baseline;justify-content:space-between;font-size:7pt;color:#aaa;font-family:'Segoe UI',Arial,sans-serif}
.doc-footer-addr{text-align:center;flex:1}
.doc-footer-info{white-space:nowrap;font-size:6.5pt}
@media screen{
  .doc-footer{position:static;margin-top:auto;padding-top:8mm;display:flex}
  .page{display:flex;flex-direction:column}
}
</style>
</head>
<body>

<!-- Control bar (screen only, not printed) -->
<div class="ctrl">
  <span class="ctrl-title">⏳ Pendent Cobrament</span>
  <span class="ctrl-status" id="ctrl-mode-label"></span>
  <label id="ctrl-client-lbl" style="display:none">Client:</label>
  <select id="ctrl-client" style="display:none;min-width:220px"><option value="">— Selecciona —</option></select>
  <button class="btn-print" style="background:#28a745" onclick="loadData()">Aplicar</button>
  <button class="btn-print" onclick="window.print()">🖨️ Imprimir</button>
  <button class="btn-close" onclick="window.close()">✕ Tancar</button>
  <span class="ctrl-status" id="ctrl-status"></span>
</div>

<div class="page">

  <!-- Logo -->
  <div class="logo-area">
    <img src="logo.png" alt="ACR Estruch">
  </div>

  <!-- Title -->
  <span class="doc-title" id="doc-title">FACTURES PENDENTS COBRAMENT</span>

  <!-- Table -->
  <table class="fra-table">
    <thead>
      <tr>
        <th>IdClient</th>
        <th>Client</th>
        <th>NoFact</th>
        <th>DataVenc</th>
        <th>DataFact</th>
        <th>PJ</th>
        <th class="r">Total Fra</th>
        <th class="r">Cobrat</th>
        <th class="r">Pendent</th>
      </tr>
    </thead>
    <tbody id="fra-tbody">
      <tr><td colspan="9" style="padding:6mm;color:#888;text-align:center">Carregant…</td></tr>
    </tbody>
    <tfoot id="fra-tfoot"></tfoot>
  </table>

  <!-- Footer fixat al peu -->
  <div class="doc-footer">
    <div class="doc-footer-info" id="page-info"></div>
    <div class="doc-footer-addr">Muntaner, 440, 1-1B &nbsp;|&nbsp; 08006 Barcelona &nbsp;|&nbsp; +34 609852478 &nbsp;|&nbsp; info@acrestruch.com &nbsp;|&nbsp; www.acrestruch.com</div>
  </div>

</div>

<script src="js/neon-client.js"></script>
<script>
requireAuth();

const urlParams = new URLSearchParams(location.search);
const mode = urlParams.get('mode') || 'all'; // 'all' | 'client'
const isClient = (mode === 'client');

document.getElementById('ctrl-mode-label').textContent = isClient ? '1 Client' : 'Tots els clients';
document.getElementById('doc-title').textContent = isClient
  ? 'FACTURES PENDENTS COBRAMENT — 1 CLIENT'
  : 'FACTURES PENDENTS COBRAMENT';

const ctrlClientLbl = document.getElementById('ctrl-client-lbl');
const ctrlClientSel = document.getElementById('ctrl-client');
if (isClient) {
  ctrlClientLbl.style.display = '';
  ctrlClientSel.style.display = '';
  sbGet('clients', 'select=id,codi,rao_social&order=rao_social.asc').then(clis => {
    clis.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = `${c.codi || ''} — ${c.rao_social}`;
      ctrlClientSel.appendChild(o);
    });
    const cliParam = urlParams.get('client');
    if (cliParam) { ctrlClientSel.value = cliParam; loadData(); }
  });
}

function fN(n) {
  return Number(n || 0).toLocaleString('ca-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('T')[0].split('-');
  return `${d}/${m}/${String(y).slice(2)}`;
}

// ── Main render ────────────────────────────────────────────────────────────
async function loadData() {
  const clientId = isClient ? ctrlClientSel.value : '';
  if (isClient && !clientId) { alert('Selecciona un client'); return; }
  const tbody = document.getElementById('fra-tbody');
  const tfoot = document.getElementById('fra-tfoot');

  tbody.innerHTML = '<tr><td colspan="9" style="padding:6mm;color:#888;text-align:center">Carregant…</td></tr>';
  tfoot.innerHTML = '';
  document.getElementById('ctrl-status').textContent = '';

  try {
    let qs = `select=*,clients(codi,rao_social)&estat=neq.COBRAT&estat=neq.ANULADA&estat=neq.RECTIFICATIVA&order=no_factura.asc,data_fra.asc`;
    if (clientId) qs += `&id_client=eq.${clientId}`;
    const allRows = await sbGet('factures', qs);
    // Filtre addicional per import real pendent: exclou factures on l'estat
    // no s'ha marcat COBRAT però l'import cobrat ja iguala el total.
    const rows = allRows.filter(r => (parseFloat(r.total_factura) || 0) - (parseFloat(r.import_cobrat) || 0) > 0.01);

    if (isClient && allRows.length) {
      document.getElementById('doc-title').textContent =
        `FACTURES PENDENTS COBRAMENT — ${allRows[0].clients?.rao_social || ''}`;
    }

    renderTable(rows);
    document.getElementById('ctrl-status').textContent = rows.length
      ? `${rows.length} factures pendents`
      : 'Cap factura pendent';
    document.getElementById('page-info').textContent =
      `${new Date().toLocaleDateString('ca-ES')} - 1 / 1 - qa_IN_list`;

  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="9" style="color:#c00;padding:6mm">Error: ${e.message}</td></tr>`;
    document.getElementById('ctrl-status').textContent = 'Error de càrrega';
  }
}

function rowHtml(inv, extraClass='') {
  const imp  = parseFloat(inv.total_factura) || 0;
  const cob  = parseFloat(inv.import_cobrat) || 0;
  const pend = imp - cob;
  const codi   = inv.clients?.codi || inv.id_client || '';
  const client = inv.clients?.rao_social || '';
  const cls = extraClass ? ` class="${extraClass}"` : '';
  return `<tr${cls}>
    <td>${codi}</td>
    <td>${client}</td>
    <td>${inv.no_factura || ''}</td>
    <td>${fDate(inv.data_venciment)}</td>
    <td>${fDate(inv.data_fra)}</td>
    <td>${inv.id_projecte || ''}</td>
    <td class="r">${fN(imp)}</td>
    <td class="r">${cob ? fN(cob) : '—'}</td>
    <td class="r neg">${fN(pend)}</td>
  </tr>`;
}

function subtotalHtml(n, imp, cob, pend) {
  return `<tr class="subtotal">
    <td class="lbl" colspan="6">No.factures: ${n}</td>
    <td class="r">${fN(imp)}</td>
    <td class="r">${fN(cob)}</td>
    <td class="r">${fN(pend)}</td>
  </tr>`;
}

function renderTable(rows) {
  const tbody = document.getElementById('fra-tbody');
  const tfoot = document.getElementById('fra-tfoot');

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="padding:6mm;color:#888;text-align:center">✅ Cap factura pendent de cobrament</td></tr>';
    tfoot.innerHTML = '';
    return;
  }

  let html = '';
  let totImp = 0, totCob = 0, totPend = 0;

  if (isClient) {
    rows.forEach(inv => {
      html += rowHtml(inv);
      totImp += parseFloat(inv.total_factura) || 0;
      totCob += parseFloat(inv.import_cobrat) || 0;
    });
    totPend = totImp - totCob;
  } else {
    // Agrupar per client
    const byClient = {};
    rows.forEach(inv => {
      const ck = inv.id_client;
      if (!byClient[ck]) byClient[ck] = [];
      byClient[ck].push(inv);
    });

    let isFirstGroup = true;
    Object.values(byClient).forEach(group => {
      let gImp = 0, gCob = 0;
      group.forEach((inv, i) => {
        const cls = (i === 0 && !isFirstGroup) ? 'grp-first' : '';
        html += rowHtml(inv, cls);
        gImp += parseFloat(inv.total_factura) || 0;
        gCob += parseFloat(inv.import_cobrat) || 0;
      });
      html += subtotalHtml(group.length, gImp, gCob, gImp - gCob);
      totImp += gImp; totCob += gCob;
      isFirstGroup = false;
    });
    totPend = totImp - totCob;
  }

  tbody.innerHTML = html;
  tfoot.innerHTML = `<tr>
    <td colspan="6" style="font-style:italic">Total factures: ${rows.length}</td>
    <td class="r">${fN(totImp)}</td>
    <td class="r">${fN(totCob)}</td>
    <td class="r">${fN(totPend)}</td>
  </tr>`;
}

// ── Start ──────────────────────────────────────────────────────────────────
if (!isClient) loadData();
else if (!urlParams.get('client')) {
  document.getElementById('fra-tbody').innerHTML =
    '<tr><td colspan="9" style="padding:6mm;color:#888;text-align:center">Selecciona un client i clica Aplicar</td></tr>';
}
</script>
</body>
</html>
