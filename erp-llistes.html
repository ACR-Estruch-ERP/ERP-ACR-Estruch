<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP ACR Estruch — Llistes</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#00387C;--blue-mid:#1a54a0;--blue-light:#e8f0fb;--blue-dim:#d0e0f5;
  --green:#1a8c42;--green-bg:#d4edda;--green-txt:#155724;
  --red:#c0392b;--red-bg:#f8d7da;--red-txt:#721c24;
  --grey:#6c757d;--grey-bg:#e9ecef;--grey-txt:#495057;
  --bg:#F4F6F8;--white:#fff;--border:#E7E9ED;--border-light:#E7E9ED;
  --text:#1D2433;--muted:#6B7280;
  --accent:#236EFA;--accent-soft:#EAF1FF;
  --sidebar:220px;--topbar:64px;--r:10px;
  --shadow:0 4px 16px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
#sidebar{width:var(--sidebar);background:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding-top:20px}
#logo-area{padding:0 20px 22px;cursor:pointer}
.logo-main{font-size:18px;font-weight:700;color:var(--blue);letter-spacing:-.3px;line-height:1.1}
.logo-sub{font-size:10.5px;color:var(--muted);margin-top:4px}
#nav{padding:6px 0;flex:1}
.nav-section{padding:16px 20px 6px;font-size:9.5px;color:#9CA3AF;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;color:var(--blue);cursor:pointer;transition:background .15s;font-size:13px;user-select:none;border-radius:0 8px 8px 0;margin-right:12px}
.nav-item:hover{background:#F9FAFB}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .ico{width:16px;height:16px;color:#9CA3AF;flex-shrink:0;display:inline-flex}
.nav-item.active .ico{color:var(--accent)}
.nav-item .ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-sub{padding:6px 20px 6px 46px;color:var(--muted);cursor:pointer;font-size:12px;transition:color .15s;user-select:none}
.nav-sub:hover{color:var(--text)}
.nav-footer{padding:12px 20px;font-size:11px;color:#9CA3AF}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#topbar{height:var(--topbar);background:var(--bg);display:flex;align-items:center;padding:0 32px;gap:12px;flex-shrink:0}
#topbar h1{font-size:18px;font-weight:700;color:var(--blue);flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-sm{padding:5px 10px;font-size:12px}
#content{flex:1;overflow:hidden;padding:18px 22px}

/* ── Layout principal (idèntic a llistats) ── */
.ll-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;height:calc(100vh - var(--topbar) - 36px)}
.ll-index{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.ll-index-hdr{padding:14px 18px;border-bottom:1px solid var(--border);font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.8px}
.ll-grup-item{padding:13px 18px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-light)}
.ll-grup-item:hover{background:var(--blue-light)}
.ll-grup-item.active{background:#eff6ff;border-left-color:var(--blue);font-weight:700;color:var(--blue)}
.ll-grup-item:last-child{border-bottom:none}
.ll-grup-ico{width:18px;height:18px;color:#9CA3AF;display:inline-flex;flex-shrink:0}
.ll-grup-ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ll-grup-info{flex:1}
.ll-grup-nom{font-size:13px;font-weight:600}
.ll-grup-desc{font-size:11px;color:var(--muted);margin-top:2px}
.ll-content{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ll-content-hdr{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.ll-content-hdr h2{font-size:15px;font-weight:700;color:var(--blue);flex:1}
.ll-blocs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-wrap:wrap;gap:20px;align-content:flex-start}

/* ── Blocs editables ── */
.ll-bloc{min-width:180px;flex:0 0 auto}
.ll-bloc-hdr{display:block;font-size:10px;font-weight:700;color:#236EFA;letter-spacing:.7px;text-transform:uppercase;background:#fff;border:1px solid var(--border);border-radius:5px;padding:4px 8px;margin-bottom:8px}
.ll-bloc ul{list-style:none;display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.ll-item{display:flex;align-items:center;background:var(--white);border:1px solid var(--border-light);border-radius:5px;overflow:hidden;padding:4px 4px 4px 8px;font-size:12.5px;gap:6px}
.ll-item span{flex:1;color:var(--text)}
.ll-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:14px;padding:0 3px;line-height:1;transition:color .12s;flex-shrink:0}
.ll-del:hover{color:var(--red)}
.ll-add{display:flex;gap:6px;margin-top:2px}
.ll-add input{flex:1;padding:4px 8px;border:1.5px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;color:var(--text)}
.ll-add input:focus{outline:none;border-color:var(--blue)}
.ll-add button{padding:4px 10px;background:var(--blue);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:700}
.ll-add button:hover{background:var(--blue-mid)}
.ll-empty{font-size:12px;color:var(--muted);font-style:italic;padding:4px 2px;margin-bottom:6px}

/* Toast */
#toast{position:fixed;bottom:22px;right:22px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:11px 18px;border-radius:var(--r);font-size:13px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .3s ease}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.inf{background:var(--blue)}
@keyframes tin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:3px}
</style>
</head>
<body>
<div id="app">

<nav id="sidebar">
  <div id="logo-area" onclick="location.href='index.html'">
    <div class="logo-main">ACR Estruch - ERP</div>
    <div class="logo-sub">ACR Estruch ERP v2.0</div>
  </div>
  <div id="nav">
    <div class="nav-item" onclick="location.href='index.html'"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></span> Dashboard</div>
    <div class="nav-section">Mòduls</div>
    <div class="nav-item" onclick="location.href='index.html'"><span class="ico"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg></span> Facturació</div>
    <div class="nav-sub" onclick="location.href='erp-facturacio.html'">Factures emeses</div>
    <div class="nav-sub" onclick="location.href='erp-factures-rebudes.html'">Factures rebudes</div>
    <div class="nav-item" onclick="location.href='erp-clients.html'"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5.5 5.5 0 0 1 5.5 5.5"/></svg></span> Clients</div>
    <div class="nav-item" onclick="location.href='erp-proveidors.html'"><span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg></span> Proveïdors</div>
    <div class="nav-item" onclick="location.href='erp-entitats.html'"><span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M8 9h2M14 9h2M8 13h2M14 13h2"/></svg></span> Entitats</div>
    <div class="nav-item" onclick="location.href='erp-projectes.html'"><span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/></svg></span> Projectes</div>
    <div class="nav-section" style="margin-top:10px">Comptabilitat</div>
    <div class="nav-item" onclick="location.href='erp-major.html'"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 4h10a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/></svg></span> Major</div>
    <div class="nav-item" onclick="location.href='erp-assentaments.html'"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></span> Assentaments</div>
    <div class="nav-item" onclick="location.href='erp-pla-comptes.html'"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg></span> Pla de comptes</div>
    <div class="nav-section" style="margin-top:10px">Altres</div>
    <div class="nav-item" onclick="location.href='erp-despeses.html'"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></span> Despeses</div>
    <div class="nav-item" onclick="location.href='erp-reports.html'"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg></span> Reports</div>
    <div class="nav-item" onclick="location.href='erp-tags.html'"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1"/></svg></span> Tags</div>
    <div class="nav-item" onclick="location.href='erp-llistats.html'"><span class="ico"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span> Llistats</div>
    <div class="nav-item active" onclick="location.href='erp-llistes.html'"><span class="ico"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span> Llistes</div>
  </div>
  <div class="nav-footer">ACR Estruch ERP v2.0</div>
</nav>

<main id="main">
  <header id="topbar">
    <h1>Llistes</h1>
    <button class="btn btn-sm" style="background:#fff;color:#DC2626;border:1px solid var(--border)" onclick="doLogout()"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:#DC2626;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>Sortir</button>
  </header>
  <div id="content">
    <div class="ll-layout">

      <!-- Panel esquerre: mòduls -->
      <div class="ll-index">
        <div class="ll-index-hdr">Mòdul</div>
        <div id="ll-moduls"></div>
      </div>

      <!-- Panel dret: llistes editables -->
      <div class="ll-content">
        <div class="ll-content-hdr">
          <h2 id="content-title">—</h2>
        </div>
        <div class="ll-blocs" id="ll-blocs"></div>
      </div>

    </div>
  </div>
</main>
</div>

<div id="toast"></div>
<script src="js/neon-client.js"></script>
<script>
// ── DEFINICIÓ DE MÒDULS I LLISTES ──────────────────────────────────────────
const MODULS = [
  {
    key: 'clients', nom: 'Clients', ico: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5.5 5.5 0 0 1 5.5 5.5"/></svg>', desc: 'Situació · Grup · CNCE',
    llistes: [
      { cat: 'clients_situacio',            nom: 'Situació' },
      { cat: 'clients_grup',                nom: 'Grup / Categoria' },
      { cat: 'CNCE (classificació fiscal)', nom: 'CNCE' },
    ]
  },
  {
    key: 'projectes', nom: 'Projectes', ico: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/></svg>', desc: 'Estat · Tipus · Provinent',
    llistes: [
      { cat: 'projectes_estat',     nom: 'Estat' },
      { cat: 'projectes_tipus',     nom: 'Tipus' },
      { cat: 'projectes_provinent', nom: 'Provinent', sortAlpha: true },
    ]
  },
  {
    key: 'facturacio', nom: 'Facturació emeses', ico: '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>', desc: 'Estat · Forma cobrament',
    llistes: [
      { cat: 'factures_estat', nom: 'Estat factura' },
      { cat: 'forma_pag',      nom: 'Forma de cobrament' },
    ]
  },
  {
    key: 'fra_rebudes', nom: 'Factures rebudes', ico: '<svg viewBox="0 0 24 24"><path d="M4 13l3-8h10l3 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>', desc: 'Estat · Divises',
    llistes: [
      { cat: 'fra_rebudes_estat', nom: 'Estat' },
      { cat: 'divises',           nom: 'Divises' },
    ]
  },
  {
    key: 'despeses', nom: 'Despeses', ico: '<svg viewBox="0 0 24 24"><path d="M3 12l18-7-7 18-2-8z"/></svg>', desc: 'Tickets · Viatges',
    llistes: [
      { cat: 'tickets_tipus',    nom: 'Tipus ticket' },
      { cat: 'viatge_categoria', nom: 'Categoria viatge' },
    ]
  },
  {
    key: 'proveidors', nom: 'Proveïdors', ico: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg>', desc: 'Situació · Forma pagament · CNCE',
    llistes: [
      { cat: 'prov_situacio', nom: 'Situació' },
      { cat: 'forma_pag',     nom: 'Forma de pagament' },
      { cat: 'prov_cnce',     nom: 'CNCE' },
    ]
  },
];

// ── ESTAT ──────────────────────────────────────────────────────────────────
// Clau: "modul::categoria" per evitar barrejar forma_pag de facturacio i proveidors
let allLlistes = {};
let curModul = MODULS[0].key;

// ── INIT ──────────────────────────────────────────────────────────────────
async function init(){
  await ensureSession();
  try{
    const rows = await sbGet('llistes','select=id,modul,categoria,valor,ordre&order=modul,categoria,ordre,valor');
    allLlistes = {};
    rows.forEach(r=>{
      const k = r.modul + '::' + r.categoria;
      if(!allLlistes[k]) allLlistes[k]=[];
      allLlistes[k].push({id:r.id, valor:r.valor, ordre:r.ordre});
    });
  }catch(e){ toast('Error carregant llistes: '+e.message,'err'); }
  renderModuls();
  selectModul(MODULS[0].key, document.getElementById('m-'+MODULS[0].key));
}

// ── PANEL ESQUERRE ─────────────────────────────────────────────────────────
function renderModuls(){
  document.getElementById('ll-moduls').innerHTML = MODULS.map(m=>`
    <div class="ll-grup-item" id="m-${m.key}" onclick="selectModul('${m.key}',this)">
      <span class="ll-grup-ico">${m.ico}</span>
      <div class="ll-grup-info">
        <div class="ll-grup-nom">${m.nom}</div>
        <div class="ll-grup-desc">${m.desc}</div>
      </div>
    </div>`).join('');
}

function selectModul(key, el){
  curModul = key;
  document.querySelectorAll('.ll-grup-item').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');
  const m = MODULS.find(x=>x.key===key);
  document.getElementById('content-title').textContent = 'Llistes — ' + m.nom;
  renderBlocs(m);
}

// ── PANEL DRET ─────────────────────────────────────────────────────────────
function sid(cat){ return cat.replace(/[^a-zA-Z0-9_-]/g,'_'); }

function renderBlocs(m){
  document.getElementById('ll-blocs').innerHTML = m.llistes.map(l=>{
    const k = m.key + '::' + l.cat;
    const inputId = 'inp-' + sid(l.cat);
    const items = allLlistes[k] || [];
    const itemsHtml = items.length
      ? `<ul>${items.map(it=>`
          <li class="ll-item">
            <span>${esc(it.valor)}</span>
            <button class="ll-del" data-id="${it.id}" data-k="${esc(k)}" onclick="removeItem(this)" title="Eliminar">×</button>
          </li>`).join('')}</ul>`
      : `<p class="ll-empty">Cap valor definit</p>`;
    return `
      <div class="ll-bloc">
        <span class="ll-bloc-hdr">${l.nom}</span>
        ${itemsHtml}
        <div class="ll-add">
          <input type="text" id="${inputId}" placeholder="Afegir..."
            data-k="${esc(k)}" data-cat="${esc(l.cat)}" data-modul="${m.key}"
            onkeydown="if(event.key==='Enter')addItem('${inputId}')">
          <button onclick="addItem('${inputId}')">+</button>
        </div>
      </div>`;
  }).join('');
}

// ── CRUD ──────────────────────────────────────────────────────────────────
async function addItem(inputId){
  const inp = document.getElementById(inputId);
  const v = inp.value.trim();
  if(!v){ inp.focus(); return; }
  const k    = inp.dataset.k;
  const cat  = inp.dataset.cat;
  const modul= inp.dataset.modul;
  const exists = (allLlistes[k]||[]).some(x=>x.valor===v);
  if(exists){ toast('Ja existeix','inf'); inp.focus(); return; }
  const llistaCfg = MODULS.find(m=>m.key===modul)?.llistes.find(l=>l.cat===cat);
  try{
    const ordre = (allLlistes[k]||[]).length + 1;
    const res = await sbPost('llistes',{modul, categoria:cat, valor:v, ordre});
    if(!allLlistes[k]) allLlistes[k]=[];
    allLlistes[k].push({id:res[0].id, valor:v, ordre});
    if(llistaCfg?.sortAlpha) await resortAlpha(k);
    inp.value='';
    toast('Afegit','ok');
    selectModul(curModul, document.getElementById('m-'+curModul));
  }catch(e){ toast('Error: '+e.message,'err'); }
}

// Reordena alfabèticament tota la categoria i persisteix el nou 'ordre' de
// cada fila (només per a llistes marcades sortAlpha — les altres mantenen
// l'ordre manual d'inserció, p.ex. Estat no és alfabètic a propòsit)
async function resortAlpha(k){
  const items = allLlistes[k]||[];
  const sorted = [...items].sort((a,b)=>a.valor.localeCompare(b.valor,'ca'));
  const patches = [];
  sorted.forEach((it,i)=>{
    const nouOrdre = i+1;
    if(it.ordre!==nouOrdre){ it.ordre=nouOrdre; patches.push(sbPatch('llistes', it.id, {ordre:nouOrdre})); }
  });
  await Promise.all(patches);
  allLlistes[k] = sorted;
}

async function removeItem(btn){
  if(!confirm('Eliminar aquest valor?')) return;
  const id = parseInt(btn.dataset.id);
  const k  = btn.dataset.k;
  try{
    await sbDel('llistes', id);
    allLlistes[k] = (allLlistes[k]||[]).filter(x=>x.id!==id);
    toast('Eliminat','ok');
    selectModul(curModul, document.getElementById('m-'+curModul));
  }catch(e){ toast('Error: '+e.message,'err'); }
}

// ── UTILS ──────────────────────────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg,type='inf'){
  const el=document.createElement('div');
  el.className=`toast ${type}`;el.textContent=msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

function doLogout(){
  if(typeof signOut==='function') signOut();
  else location.href='login.html';
}

init();
</script>
</body>
</html>
